apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-simple-webserver
  labels:
    app: go-simple-webserver
spec:
  replicas: 10
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
  selector:
    matchLabels:
      app: go-simple-webserver
  template:
    metadata:
      labels:
        app: go-simple-webserver
    spec:
      containers:
        - name: webserver
          image: ghcr.io/alexciornei22/ci-cd-lab@sha256:c02aee8c621d9cd9f9d903b3a5d227c421f080e0e37a1981968f0c3f96dc3da9
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
